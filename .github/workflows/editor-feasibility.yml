name: editor feasibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/research/editor13 -v
  public-primary-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch pinned public bytes (failure means evidence unavailable or changed)
        run: python3 scripts/research/editor13/fetch_public.py --output-dir "$RUNNER_TEMP/editor13-inputs"
      - name: Verify actual public identity and peer declarations
        run: python3 scripts/research/editor13/probe.py --evidence "$RUNNER_TEMP/editor13-inputs" --output "$RUNNER_TEMP/editor13-result.json"
