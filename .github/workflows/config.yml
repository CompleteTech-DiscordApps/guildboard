name: Configuration checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  config:
    name: Configuration diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:config
      - run: npm run test:config
      - run: node scripts/verification/verify_config.mjs
      - run: node scripts/verification/verify_config_failure_paths.mjs
