name: Configuration checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  config:
    name: Configuration diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:config
      - run: npm run test:config
      - run: node scripts/verification/verify_config.mjs
      - run: node scripts/verification/verify_config_failure_paths.mjs
