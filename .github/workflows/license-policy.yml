name: License policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  license-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch verified archives
        run: python3 scripts/licenses/fetch.py --root . --output "$RUNNER_TEMP/license-artifacts"
      - name: Build local test receipt
        run: |
          python3 -c 'import json, pathlib, sys; c=json.loads(pathlib.Path("docs/licenses/inventory.json").read_text())["components"]; v=[{"url": x["artifact"]["url"], "artifact": x["artifact"]["cache_filename"]} for _, x in sorted(c.items())]; assert len(v) == 100 and len({x["url"] for x in v}) == 100; pathlib.Path(sys.argv[1]).write_text(json.dumps({"expected": 100, "verified": v}, sort_keys=True) + "\n")' "$RUNNER_TEMP/license-receipt.json"
      - name: Fixture-backed regression tests
        env:
          LICENSE16_ARTIFACT_FIXTURE: ${{ runner.temp }}/license-artifacts
          LICENSE16_ARTIFACT_RECEIPT: ${{ runner.temp }}/license-receipt.json
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests/licenses -v
      - name: Verify acquired archive identity and notice bindings
        run: python3 scripts/licenses/check_archives.py --root . --artifacts "$RUNNER_TEMP/license-artifacts"
      - name: Assess license policy
        run: python3 scripts/licenses/check.py --root .
